spring.application.name=AutoLoc
server.port=8089
spring.profiles.active=dev

# Connexion à la base de données (mot de passe fourni par la variable d'environnement DB_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
# Logs
logging.level.tn.esprit.autoloc=INFO
